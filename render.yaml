# Render.com blueprint — deploys the API + built client as one web service.
# See DEPLOY.md for step-by-step instructions.
services:
  - type: web
    name: mock-interview
    runtime: node
    plan: free
    # NODE_ENV=production (set below) makes `npm install` skip devDependencies,
    # but the build tools (tsc, vite, tailwind) live there — so force them in
    # with --include=dev, then build.
    buildCommand: npm install --include=dev && npm install --include=dev --prefix server && npm install --include=dev --prefix client && npm run build
    startCommand: npm run start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      # Premium (Claude) mode — optional. Leave unset to use Local mode (below).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Local mode — pointed at Groq's free OpenAI-compatible API so it works in
      # the cloud (Ollama only runs on your own machine). The adapter appends
      # /v1/chat/completions to the base URL.
      - key: LOCAL_AI_BASE_URL
        value: https://api.groq.com/openai
      - key: LOCAL_AI_MODEL
        value: llama-3.3-70b-versatile
      # Your free Groq key from https://console.groq.com — set in the dashboard.
      - key: LOCAL_AI_API_KEY
        sync: false
