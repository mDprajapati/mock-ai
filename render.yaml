# Render.com blueprint — deploys the API + built client as one web service.
# See DEPLOY.md for step-by-step instructions.
services:
  - type: web
    name: mock-interview
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      # Premium (Claude) mode — set the value in the Render dashboard (secret).
      # Without it, the deployed app has no working AI mode (Local needs Ollama,
      # which a cloud server cannot reach).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Local mode is intentionally left unset in the cloud — Ollama runs only
      # on your own machine. To enable it you'd need a publicly reachable
      # OpenAI-compatible server and would set LOCAL_AI_BASE_URL here.
